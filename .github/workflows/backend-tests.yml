name: Backend tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test backend
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: sura_ci
          POSTGRES_USER: sura_ci
          POSTGRES_PASSWORD: sura_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sura_ci -d sura_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://sura_ci:sura_ci@localhost:5432/sura_ci
      SECRET_KEY: ci-only-secret-not-for-production
      JWT_ALGORITHM: HS256
      DEMO_OTP_CODE: "123456"
      ENVIRONMENT: test
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Verify PostgreSQL migrations
        run: python -m alembic upgrade head

      - name: Run tests
        run: python -m pytest tests -q
